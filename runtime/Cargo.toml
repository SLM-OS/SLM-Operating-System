[package]
name = "slm-runtime"
version = "0.1.0"
edition = "2021"
authors = ["SLM-OS Team"]
description = "Rust runtime for SLM-OS kernel"

[lib]
crate-type = ["staticlib"]  # Produces .a file for linking with C

[dependencies]
linked_list_allocator = "0.10"
bitflags = { version = "2.4", default-features = false }
libm = "0.2"

[features]
default = ["slm"]
# Small Language Model runtime support: GGUF v3 parser, BBPE tokenizer,
# INT4 dequant kernels, transformer ops, KV cache, and decoder. Default-on
# so the kernel build picks it up automatically; `--no-default-features`
# disables the entire `slm` module tree.
slm = []
# Pluggable EvictionPolicy trait + classical Rust policies (M1/M3).
ai_eviction = []
# Also pulls in the generated XGBoost (~1.3 MB) and int8 MLP weights (M4).
ai_eviction_models = ["ai_eviction"]

[lints.rust]
warnings = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true          # Link-time optimization for smaller binary
opt-level = "z"     # Optimize for size
