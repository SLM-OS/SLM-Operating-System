# Cargo configuration for SLM-OS Rust runtime
#
# Default target is aarch64. For x86-64 builds, override with:
#   cargo build --target x86_64-unknown-none

[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
linker = "aarch64-none-elf-gcc"
rustflags = [
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
]

[target.x86_64-unknown-none]
linker = "gcc"
rustflags = [
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    "-C", "relocation-model=static",
]
