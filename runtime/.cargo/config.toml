# Cargo configuration for SLM-OS Rust runtime
#
# Default target is aarch64. For x86-64 builds, override with:
#   cargo build --target x86_64-unknown-none

[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
linker = "aarch64-none-elf-gcc"
rustflags = [
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    # NEON is baseline for aarch64 (ARMv8-A mandates it), but make it
    # explicit so the `#[target_feature(enable = "neon")]` attributes on
    # SIMD helpers in inference/ops.rs are consistent with build config.
    #
    # `+dotprod` adds the ARMv8.2-A FEAT_DotProd extension (UDOT/SDOT
    # instructions). Required by the NEON Q4_K vec_dot kernel in
    # `inference/quant.rs::dot_q4k_q8k_block_neon`. Mandatory on every
    # CPU we currently target — Cortex-A76 (Pi 5, QEMU virt's default
    # cortex-a76 cpu model) and Cortex-A78AE (Jetson Orin Nano) — so
    # enabling it globally is safe; the runtime won't load on a hypo-
    # thetical pre-v8.2 ARMv8 CPU, which we don't ship to.
    "-C", "target-feature=+neon,+dotprod",
]

[target.x86_64-unknown-none]
linker = "gcc"
rustflags = [
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    "-C", "relocation-model=static",
    # SSE/SSE2 are baseline for x86_64, but make it explicit for
    # consistency with aarch64. SIMD paths are aarch64-only today; this
    # is forward-looking in case x86 gains SSE intrinsics.
    "-C", "target-feature=+sse,+sse2",
]
