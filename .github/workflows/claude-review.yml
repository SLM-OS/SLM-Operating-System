# .github/workflows/claude-review.yml
#
# Automated AI code review for SLM-OS using Claude Code Action.
# Triggers on every PR to main/develop, and on @claude mentions.
#
# Setup:
#   1. Add ANTHROPIC_API_KEY to repo Settings → Secrets → Actions
#   2. Copy this file to .github/workflows/claude-review.yml
#   3. (Optional) Copy REVIEW.md to repo root
#   4. Open a test PR to verify

name: Claude Code Review

on:
  # Automatic review on every PR open/update
  pull_request:
    types: [opened, synchronize, reopened]

  # Interactive: respond to @claude mentions in PR/issue comments
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

# Prevent multiple reviews running simultaneously on the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # For comment events, only run if @claude is mentioned
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff context

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # SLM-OS-specific review prompt (only used for automated PR reviews)
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for SLM-OS, a bare-metal AI-first
            operating system targeting ARM64 (Jetson Orin Nano, Raspberry Pi 5)
            and x86-64. The codebase is C (kernel), ARM64/x86 assembly (boot),
            and Rust (runtime/AI subsystems). There is no libc, no Linux, no
            POSIX — everything runs on bare metal.

            Review this PR with focus on:

            ## Correctness & Safety
            - Memory safety: buffer overflows, use-after-free, double-free,
              stack overflow (kernel stacks are fixed-size)
            - Concurrency: missing memory barriers (dmb/dsb/isb on ARM64,
              mfence on x86), incorrect spinlock usage, lock ordering violations
            - Interrupt safety: code called from ISR context must not sleep,
              allocate, or acquire sleeping locks
            - Register access: MMIO reads/writes must use volatile, correct
              widths, and respect hardware ordering requirements

            ## Architecture Compliance
            - Platform abstraction: new hardware access should go through the
              HAL layer, not be hardcoded to one platform
            - Modular design: components should be independently loadable/
              unloadable without breaking kernel core
            - Cross-platform: changes should not break QEMU, Pi 5, Jetson,
              or x86-64 builds unless explicitly platform-gated

            ## Testing & Documentation
            - New functionality should have corresponding tests in
              kernel/tests/ or runtime tests
            - Public APIs should have doc comments
            - Non-obvious decisions should have inline comments explaining why

            ## ARM64/x86 Specifics
            - Exception level awareness (EL1 vs EL2 with VHE)
            - Cache maintenance operations (DC CIVAC, IC IALLU) where needed
            - TLB invalidation after page table changes
            - Correct use of non-cacheable memory for cross-CPU shared data

            If you find issues, use inline comments on the specific lines.
            For overall observations, post a summary comment on the PR.
            Rate each finding as Critical, Warning, or Suggestion.

          claude_args: |
            --model claude-sonnet-4-20250514
            --max-turns 10
