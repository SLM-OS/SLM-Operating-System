# Report-only build matrix: every PLATFORM x build option, one option flipped
# from its default at a time, plus each platform's test kernel and the "wide"
# configuration `make check-braces` configures. BUILDS ONLY: nothing is run,
# no QEMU, no hardware. Failures and warnings never fail the workflow.
#
# The cells come from scripts/ci/build_matrix.py (run it with `markdown` to see
# the inventory and the skipped cells). Each cell is its own job on its own
# runner, because runtime/target is shared across BUILD_DIRs and two builds in
# one checkout would mix cargo features.
name: build-matrix

# When it runs: on pull requests to main, nightly, and by hand. Not on every
# push. 11:17 UTC is 03:17 PST / 04:17 PDT, off the hour so it avoids the
# top-of-hour scheduling crowd.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same workflow and ref (for example a new push to a PR)
# cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_TOOLCHAIN_VERSION: 13.3.rel1
  ARM_TOOLCHAIN_SHA256: 7fedf894040580b1db747d06ac5d4263c46e591ffe7695656d1da5accb00a159
  ARM_TOOLCHAIN_DIR: /home/runner/arm-gnu-toolchain

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: gen
        run: |
          python3 scripts/ci/build_matrix.py github >> "$GITHUB_OUTPUT"
          python3 scripts/ci/build_matrix.py markdown >> "$GITHUB_STEP_SUMMARY"

  # Download the toolchains once and save them to the cache, so the matrix
  # jobs only restore (no 100+ parallel downloads from developer.arm.com).
  toolchains:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.rust.outputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: rust
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
      - id: arm-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.ARM_TOOLCHAIN_DIR }}
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-aarch64-none-elf
      - if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          f=arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-aarch64-none-elf.tar.xz
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$f" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/$f"
          echo "${ARM_TOOLCHAIN_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$ARM_TOOLCHAIN_DIR"
          tar -xJf "$RUNNER_TEMP/$f" -C "$ARM_TOOLCHAIN_DIR" --strip-components=1
          "$ARM_TOOLCHAIN_DIR/bin/aarch64-none-elf-gcc" --version
      - id: rust-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.rust.outputs.channel }}-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/${{ steps.rust.outputs.channel }}-x86_64-unknown-linux-gnu
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: rust-${{ hashFiles('rust-toolchain.toml', 'runtime/Cargo.lock') }}
      - if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "${{ steps.rust.outputs.channel }}" --profile minimal \
            --target aarch64-unknown-none --target x86_64-unknown-none
          (cd runtime && cargo fetch --locked)

  build:
    needs: [plan, toolchains]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.id }}
    env:
      CELL_ID: ${{ matrix.id }}
      CELL_PLATFORM: ${{ matrix.platform }}
      CELL_TARGET: ${{ matrix.target }}
      CELL_MAKE_ARGS: ${{ matrix.make_args }}
      CELL_EXTRA_CMAKE: ${{ matrix.extra_cmake }}
      CELL_OUT: ${{ github.workspace }}/ci-out/${{ matrix.id }}
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.ARM_TOOLCHAIN_DIR }}
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-aarch64-none-elf
          fail-on-cache-miss: true
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.rustup/toolchains/${{ needs.toolchains.outputs.rust }}-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/${{ needs.toolchains.outputs.rust }}-x86_64-unknown-linux-gnu
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: rust-${{ hashFiles('rust-toolchain.toml', 'runtime/Cargo.lock') }}
          fail-on-cache-miss: true
      # X86_64 embeds the ga107 GSP firmware from /lib/firmware (Ubuntu's
      # linux-firmware-nvidia-graphics, as on a developer host). Without it
      # every X86_64 build stops in nvidia_gsp_firmware.S, whatever
      # ENABLE_GSP_FIRMWARE says; the x86-ENABLE_GSP_FIRMWARE=OFF cell still
      # exercises that path because the option, not the host, turns it off.
      - name: GSP firmware (X86_64)
        if: matrix.platform == 'X86_64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends linux-firmware-nvidia-graphics zstd
          ls /lib/firmware/nvidia/ga107/gsp/
      - name: Tool versions
        run: |
          echo "$ARM_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$ARM_TOOLCHAIN_DIR/bin:$PATH"
          aarch64-none-elf-gcc --version | head -1
          gcc --version | head -1
          cmake --version | head -1
          (cd runtime && rustc --version && cargo --version)
      - name: Build ${{ matrix.id }}
        run: bash scripts/ci/build_cell.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cell-${{ matrix.id }}
          path: ci-out/${{ matrix.id }}
          retention-days: 30

  summary:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cell-*
          path: ci-out
      - run: |
          # download-artifact puts each artifact in ci-out/cell-<id>/
          python3 scripts/ci/summarize.py ci-out summary.json > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-matrix-summary
          path: |
            summary.md
            summary.json
