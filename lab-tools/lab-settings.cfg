# Lab Settings Configuration
# This file contains environment-specific settings for the Jetson lab setup.
# Source this file or use the helper functions in lab-tools scripts.
#
# Last verified: 28 December 2025 (Ubuntu lab machine)
# - Serial: Bidirectional 115200 baud verified
# - Smart plug: Correctly controls Jetson power

# =============================================================================
# Smart Plug (Kasa) - Controls Jetson Power
# =============================================================================
KASA_PLUG_IP="192.168.4.112"

# =============================================================================
# Serial Ports
# =============================================================================
# Jetson USB-C Debug Console (TCU - works with Linux, not bare-metal)
# Note: ttyACM0 is an STLink debugger (STM32 board), not the Jetson.
# The USB-C debug port is not currently connected on the Ubuntu lab machine.
# When connected, it typically appears as /dev/ttyACM1.
JETSON_DEBUG_PORT="/dev/ttyACM1"

# Jetson 40-pin Header UART (UARTA at 0x03100000)
# This is the primary serial port for SLM-OS debugging.
# Uses a USB-to-serial adapter (FTDI/CH340/CP2102/etc.)
# Typically shows up as /dev/ttyUSB0 or /dev/ttyUSB1
JETSON_UART_PORT="/dev/ttyUSB0"

# Baud rate for both serial connections
SERIAL_BAUD=115200

# =============================================================================
# Power Cycle Settings
# =============================================================================
# Delay in seconds between power off and on during a power cycle
POWER_CYCLE_DELAY=3

# =============================================================================
# Notes
# =============================================================================
# To identify which USB serial device is which:
#   1. Unplug all USB serial adapters
#   2. Run: ls /dev/ttyUSB* /dev/ttyACM*
#   3. Plug in one adapter, run the command again to see which appeared
#   4. Repeat for each adapter
#
# Or use udevadm to get device info:
#   udevadm info -a /dev/ttyUSB0 | grep -E "ATTRS{serial}|ATTRS{idVendor}|ATTRS{idProduct}"
#
# To create persistent symlinks by serial number, add udev rules to:
#   /etc/udev/rules.d/99-jetson-serial.rules
